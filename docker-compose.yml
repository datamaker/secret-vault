services:
  postgres:
    image: postgres:16-alpine
    container_name: secret-vault-db
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    # DB 는 호스트에 열지 않는다. 같은 네트워크의 backend 만 붙으면 된다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-secret_vault}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-network

  backend:
    build:
      # Dockerfile 이 packages/shared 를 참조한다 — 컨텍스트는 레포 루트여야 한다.
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: secret-vault-api
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-secret_vault}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      # SSO (OIDC) — optional; empty values keep SSO disabled
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-secret-vault}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLI_CLIENT_ID: ${OIDC_CLI_CLIENT_ID:-secret-vault-cli}
      VAULT_PUBLIC_URL: ${VAULT_PUBLIC_URL:-}
    ports:
      - "${VAULT_API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - vault-network

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # 비워 두면 SPA 가 상대경로 /api/v1 을 쓰고, 이 컨테이너의 nginx 가
        # backend 로 넘긴다. 값을 박으면 그 주소가 빌드에 그대로 굳는다.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: secret-vault-web
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${VAULT_WEB_PORT:-8081}:80"
    networks:
      - vault-network

volumes:
  postgres_data:
    driver: local

networks:
  vault-network:
    driver: bridge
