services:
  postgres:
    image: postgres:16-alpine
    container_name: vault-db
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    # DB 는 호스트에 열지 않는다. 같은 네트워크의 vault 만 붙으면 된다.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-secret_vault}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-network

  vault:
    # 웹 UI 와 API 가 한 이미지다. 프런트가 상대경로(/api/v1)를 쓰고 백엔드가
    # express.static 으로 서빙하므로 nginx 컨테이너를 따로 둘 이유가 없다.
    build: .
    container_name: vault
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-secret_vault}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # 같은 출처라 CORS 를 안 탄다. vite dev 서버로 따로 띄울 때만 준다.
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # SSO (OIDC) — 비워 두면 SSO 꺼짐
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-secret-vault}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLI_CLIENT_ID: ${OIDC_CLI_CLIENT_ID:-secret-vault-cli}
      VAULT_PUBLIC_URL: ${VAULT_PUBLIC_URL:-}
    ports:
      - '${VAULT_PORT:-3000}:3000'
    networks:
      - vault-network

volumes:
  postgres_data:
    driver: local

networks:
  vault-network:
    driver: bridge
