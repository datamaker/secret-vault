<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Secret Vault — Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; color: #f9fafb; margin: 0; padding: 32px; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
    label { display: block; font-size: 13px; color: #9ca3af; margin: 16px 0 4px; }
    input { width: 100%; box-sizing: border-box; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 10px 12px; color: #f9fafb; font-size: 14px; }
    input:focus { outline: none; border-color: #6366f1; }
    .hint { font-size: 12px; color: #6b7280; margin-top: 4px; }
    button { margin-top: 20px; background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 10px 16px; font-size: 14px; cursor: pointer; }
    button:hover { background: #4338ca; }
    button.secondary { background: #374151; margin-left: 8px; }
    #status { margin-top: 16px; font-size: 13px; }
    #status.ok { color: #34d399; }
    #status.error { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 Secret Vault — Settings</h1>
    <label for="vaultUrl">Vault URL</label>
    <input id="vaultUrl" type="text" placeholder="http://vault.internal:3000" />
    <p class="hint">사내망/VPN에서 접근 가능한 vault 주소 (API 경로 제외)</p>

    <label for="apiToken">Team API Token</label>
    <input id="apiToken" type="password" placeholder="sv_..." />
    <p class="hint">vault의 Tokens 페이지에서 발급한 팀 스코프 read 토큰</p>

    <button id="save">Save</button>
    <button id="test" class="secondary">Test Connection</button>
    <div id="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
