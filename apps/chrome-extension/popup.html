<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #111827; color: #f9fafb; margin: 0; width: 360px; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1f2937; }
    header .title { font-weight: 700; font-size: 14px; }
    header .links { display: flex; gap: 10px; }
    header a { color: #9ca3af; text-decoration: none; font-size: 12px; cursor: pointer; }
    header a:hover { color: #f9fafb; }
    .view { padding: 0; }
    .pad { padding: 16px; }
    label { display: block; font-size: 12px; color: #9ca3af; margin: 10px 0 4px; }
    input, select { box-sizing: border-box; width: 100%; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 8px 10px; color: #f9fafb; font-size: 13px; }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    button.primary { width: 100%; margin-top: 14px; background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; cursor: pointer; }
    button.primary:hover { background: #4338ca; }
    button.primary:disabled { opacity: 0.6; cursor: default; }
    #search { box-sizing: border-box; width: calc(100% - 32px); margin: 12px 16px 4px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; padding: 8px 10px; color: #f9fafb; font-size: 13px; }
    .section-label { font-size: 11px; color: #6b7280; padding: 10px 16px 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .item { padding: 10px 16px; border-bottom: 1px solid #1f2937; }
    .item .name { font-size: 13px; font-weight: 600; }
    .item .name .team { font-weight: 400; font-size: 11px; color: #6b7280; margin-left: 6px; }
    .item .meta { font-size: 12px; color: #9ca3af; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item .actions { display: flex; gap: 6px; margin-top: 8px; }
    .item button { background: #374151; color: #f9fafb; border: none; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    .item button:hover { background: #4b5563; }
    .item button.fill { background: #4f46e5; }
    .item button.fill:hover { background: #4338ca; }
    .empty { padding: 24px 16px; text-align: center; color: #6b7280; font-size: 13px; }
    .status { font-size: 12px; margin-top: 10px; min-height: 16px; }
    .status.error { color: #f87171; }
    .status.ok { color: #34d399; }
    .hidden { display: none; }
    h2 { font-size: 14px; margin: 0 0 4px; }
    .subtitle { font-size: 12px; color: #6b7280; margin: 0; }
  </style>
</head>
<body>
  <header>
    <div class="title">🔑 Secret Vault</div>
    <div class="links">
      <a id="addLink" class="hidden">+ New</a>
      <a id="logoutLink" class="hidden">Logout</a>
      <a id="openOptions">⚙</a>
    </div>
  </header>

  <!-- Login view -->
  <div id="loginView" class="view pad hidden">
    <h2>Sign in to your vault</h2>
    <p class="subtitle">사내망/VPN에서 접근 가능한 vault 계정으로 로그인</p>
    <label for="loginVaultUrl">Vault URL</label>
    <input id="loginVaultUrl" type="text" placeholder="http://localhost:3000" />
    <label for="loginEmail">Email</label>
    <input id="loginEmail" type="email" placeholder="you@datasee.co.kr" />
    <label for="loginPassword">Password</label>
    <input id="loginPassword" type="password" />
    <button id="loginButton" class="primary">Sign In</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <!-- List view -->
  <div id="listView" class="view hidden">
    <input id="search" type="text" placeholder="Search credentials..." />
    <div id="content"><div class="empty">Loading...</div></div>
  </div>

  <!-- Add view -->
  <div id="addView" class="view pad hidden">
    <h2>New Credential</h2>
    <label for="addTeam">Team</label>
    <select id="addTeam"></select>
    <label for="addName">Name</label>
    <input id="addName" type="text" placeholder="AWS Console (shared)" />
    <label for="addUrl">URL</label>
    <input id="addUrl" type="text" placeholder="https://..." />
    <label for="addUsername">Username / ID</label>
    <input id="addUsername" type="text" />
    <label for="addPassword">Password</label>
    <input id="addPassword" type="password" />
    <button id="addSave" class="primary">Save to Vault</button>
    <button id="addCancel" class="primary" style="background:#374151; margin-top:8px;">Cancel</button>
    <div id="addStatus" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
