service: vault-secret-fetcher

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'ap-northeast-2'}
  stage: ${opt:stage, 'prod'}
  memorySize: 128
  timeout: 15
  logRetentionInDays: 30
  # vault가 있는 VPC/서브넷에 붙는다. 이 SG에서 vault SG로의 인바운드(포트)가 허용돼야 함.
  # vault 외에는 아무 데도 호출하지 않으므로 NAT/VPC 엔드포인트가 필요 없다.
  vpc:
    securityGroupIds:
      - ${env:FETCHER_SECURITY_GROUP_ID}
    subnetIds:
      - ${env:FETCHER_SUBNET_ID_A}
      - ${env:FETCHER_SUBNET_ID_B}
  environment:
    VAULT_BASE_URL: ${env:VAULT_BASE_URL} # 예: http://10.0.1.23:3000 (VPC 내부 주소)
    # vault에서 발급한 스코프 API 토큰 (sv_...).
    # 접근 범위(프로젝트/환경)는 vault가 토큰 스코프로 강제한다.
    # 스테이지별로 다른 토큰을 발급해 함수를 분리 배포할 것.
    VAULT_API_KEY: ${env:VAULT_API_KEY}

functions:
  fetchSecrets:
    handler: handler.handler
    name: vault-secret-fetcher-${self:provider.stage}
    description: Fetch secrets from private vault for CI deploy-time injection
