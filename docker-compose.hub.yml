# Docker Hub 이미지로 바로 띄우기 — 소스를 받지 않고 쓰는 경우.
# 소스에서 빌드하려면 docker-compose.yml 을 쓴다.
services:
  postgres:
    image: postgres:16-alpine
    container_name: vault-db
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secret_vault}
      POSTGRES_USER: ${POSTGRES_USER:-vault_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?비밀번호가 필요합니다}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vault_user} -d ${POSTGRES_DB:-secret_vault}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vault-network

  vault:
    image: datamaker/vault:latest
    container_name: vault
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vault_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-secret_vault}
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:?openssl rand -hex 32 로 만든 64자 hex 가 필요합니다}
      JWT_SECRET: ${JWT_SECRET:?필요합니다}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?필요합니다}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-secret-vault}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_CLI_CLIENT_ID: ${OIDC_CLI_CLIENT_ID:-secret-vault-cli}
      VAULT_PUBLIC_URL: ${VAULT_PUBLIC_URL:-}
    ports:
      - '${VAULT_PORT:-3000}:3000'
    networks:
      - vault-network

volumes:
  postgres_data:
    driver: local

networks:
  vault-network:
    driver: bridge
