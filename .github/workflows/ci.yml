name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @secret-vault/shared

      - name: Typecheck backend
        run: npx tsc --noEmit -p apps/backend/tsconfig.json

      - name: Typecheck frontend
        run: npx tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Build backend
        run: npm run build -w @secret-vault/backend

      - name: Build frontend
        run: npm run build -w @secret-vault/frontend
