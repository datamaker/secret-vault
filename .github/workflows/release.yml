name: Release

# v1.2.3 형태의 태그를 푸시하면:
#   1. Docker Hub에 backend/frontend 이미지 push (latest + 버전 태그)
#   2. GitHub Release 생성 (커밋 기반 릴리즈 노트 자동 생성)
#
# 필요한 저장소 시크릿: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            datamaker/secret-vault-backend:latest
            datamaker/secret-vault-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            datamaker/secret-vault-frontend:latest
            datamaker/secret-vault-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect pending migrations note
        id: migrations
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGED=$(git diff --name-only "$PREV_TAG".."$GITHUB_REF_NAME" -- database/migrations | sed 's/^/- /')
          else
            CHANGED=$(ls database/migrations | sed 's/^/- /')
          fi
          {
            echo "body<<NOTE_EOF"
            if [ -n "$CHANGED" ]; then
              echo "## ⚠️ Database migrations to apply"
              echo ""
              echo "$CHANGED"
              echo ""
              echo '```bash'
              echo 'docker exec -i secret-vault-db psql -U vault_user -d secret_vault < database/migrations/<file>.sql'
              echo '```'
            fi
            echo "NOTE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "${{ steps.migrations.outputs.body }}"
